<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LED Strip Simulator · wled-home-fx</title>
<meta name="description" content="Try WLED effects in the browser: split a strip into segments, give each an effect and copy the JSON to your WLED.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the strip sits sticky on top; below, segment cards on the left and strip settings + JSON on the right (from 980px) */
:root{
  --bg:#0a0d13;
  --panel:#10151d;
  --raise:#171d28;
  --line:#252e3c;
  --fg:#e8ebf1;
  --muted:#8f98aa;
  --accent:#ffb547;
  --accent-ink:#1d1405;
  --night:#05070b;
  --warn:#ff8a7a;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;margin-bottom:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,38px);line-height:1.05;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin:4px 0 0;color:var(--muted);max-width:78ch}
.top-actions{display:flex;gap:8px;align-items:center}
a{color:var(--accent)}

.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-bottom:12px;box-shadow:0 10px 16px 2px var(--bg)}
.stage-box{background:var(--night);border:1px solid var(--line);border-radius:14px;max-height:44vh;overflow:auto}
.stage canvas{display:block;width:100%}
.stage-meta{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage-meta b{color:var(--fg);font-weight:500}

.layout{display:grid;gap:16px}
@media (min-width:980px){.layout{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
.col{display:grid;gap:16px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;display:grid;gap:12px;min-width:0}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;line-height:1.1}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field{display:grid;gap:4px;min-width:0}
.hint{margin:0;color:var(--muted);font-size:13px}

input[type=number],select,textarea{font:inherit;color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
input[type=number]{width:6.5em;font-family:var(--f-mono);font-size:13px}
select{padding-right:26px}
textarea{width:100%;min-height:110px;font-family:var(--f-mono);font-size:12px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
input[type=color]{width:40px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--raise)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
label.check{display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,pre:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{appearance:none;border:1px solid var(--line);background:var(--raise);color:var(--fg);font:500 13px/1 var(--f-body);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 9px;font-size:12px}
.btn.ghost{background:transparent}

.seg{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--segc,var(--accent));border-radius:12px;padding:12px 14px 14px;display:grid;gap:12px;min-width:0}
.seg.off{opacity:.62}
.seg-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.seg-title{font-family:var(--f-display);font-weight:700;font-size:18px;white-space:nowrap}
.seg-range{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.seg-head .grow{flex:1}
.seg-head select{max-width:220px}
.warn{color:var(--warn);font-size:12.5px}
.grid2{display:grid;gap:10px 16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.slider{display:grid;grid-template-columns:minmax(0,1fr) 3.2ch;gap:2px 10px;align-items:center}
.slider .lbl{grid-column:1/-1;text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:13px;color:var(--fg)}
.slider output{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.colors{display:flex;flex-wrap:wrap;gap:10px 18px}
.color{display:flex;align-items:center;gap:8px;font-size:13px}
.color input[type=number]{width:4.2em}
.empty{color:var(--muted);margin:0}
pre{margin:0;padding:10px 12px;background:var(--night);border:1px solid var(--line);border-radius:8px;font-family:var(--f-mono);font-size:11.5px;line-height:1.5;color:var(--fg);overflow:auto;max-height:320px;white-space:pre}
.msg{font-size:13px;color:var(--muted);margin:0}
.msg.err{color:var(--warn)}
.foot{margin:22px 0 0;color:var(--muted);font-size:13px;max-width:95ch}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-i18n-html="title"></h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="top-actions">
      <a class="btn ghost" href="https://github.com/djlex83/wled-home-fx">GitHub</a>
      <button class="btn" id="lang" type="button"></button>
    </div>
  </header>

  <div class="stage">
    <div class="stage-box" id="stageBox"><canvas id="cv" role="img" aria-label="LED strip preview"></canvas></div>
    <div class="stage-meta" id="meta"></div>
  </div>

  <div class="layout">
    <div class="col">
      <div class="row" style="justify-content:space-between">
        <h2 data-i18n="segments"></h2>
        <div class="row">
          <button class="btn small" id="restart" type="button" data-i18n="restartAll"></button>
          <button class="btn small primary" id="addSeg" type="button" data-i18n="addSeg"></button>
        </div>
      </div>
      <div id="segs" class="col"></div>
    </div>

    <div class="col">
      <section class="panel" aria-labelledby="h-strip">
        <h2 id="h-strip" data-i18n="strip"></h2>
        <div class="row">
          <div class="field"><span class="lbl" data-i18n="leds"></span><input type="number" id="count" min="1" max="1500" step="1"></div>
          <div class="field"><span class="lbl" data-i18n="type"></span>
            <select id="rgbw"><option value="0">RGB</option><option value="1">RGBW</option></select></div>
          <div class="field"><span class="lbl" data-i18n="perRow"></span><input type="number" id="perRow" min="0" max="1500" step="1"></div>
        </div>
        <div class="slider"><span class="lbl" data-i18n="brightness"></span><input type="range" id="bri" min="0" max="255"><output id="briOut"></output></div>
        <label class="check"><input type="checkbox" id="gamma"> <span data-i18n="gamma"></span></label>
        <div class="row">
          <div class="field" style="flex:1"><span class="lbl" data-i18n="examples"></span><select id="examples"></select></div>
        </div>
        <div class="row" style="align-items:flex-end">
          <div class="field"><span class="lbl" data-i18n="split"></span><input type="number" id="splitN" min="1" max="32" value="3"></div>
          <button class="btn" id="splitBtn" type="button" data-i18n="splitBtn"></button>
        </div>
      </section>

      <section class="panel" aria-labelledby="h-json">
        <h2 id="h-json" data-i18n="json"></h2>
        <p class="hint" data-i18n="exportHint"></p>
        <pre id="out" tabindex="0"></pre>
        <div class="row"><button class="btn small" id="copy" type="button" data-i18n="copy"></button><p class="msg" id="copyMsg" hidden></p></div>
        <span class="lbl" data-i18n="import"></span>
        <p class="hint" data-i18n="importHint"></p>
        <textarea id="in" spellcheck="false" placeholder='{"bri":128,"seg":[{"id":0,"start":0,"stop":60,"fx":85,"col":[[255,170,0]]}]}'></textarea>
        <div class="row"><button class="btn small" id="apply" type="button" data-i18n="apply"></button></div>
        <p class="msg" id="inMsg" hidden></p>
      </section>
    </div>
  </div>

  <p class="foot" data-i18n="foot"></p>
</div>

<script>

function loadExample(k) {

  Object.assign(strip, { count: e.count, rgbw: e.rgbw, bri: e.bri });
  segs = e.segs.map(([fx, a, b, o]) => newSeg(a, b, fx, o)); renumber(); renderAll();

/* ================= stage ================= */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), box = document.getElementById('stageBox');
const gA = document.createElement('canvas'), gActx = gA.getContext('2d'), gB = document.createElement('canvas'), gBctx = gB.getContext('2d');
let geo = null;
function layout() {
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = box.clientWidth || 600, pad = 16, avail = W - pad * 2, n = strip.count;
  let perRow = strip.perRow > 0 ? Math.min(strip.perRow, n) : Math.min(n, Math.max(8, Math.floor(avail / 9)));
  let pitch = Math.min(18, avail / perRow);
  const rows = Math.ceil(n / perRow), band = 16, rowH = band + pitch + 12, H = pad * 2 + rows * rowH - 12;
  const offX = pad + (avail - perRow * pitch) / 2;
  cv.style.height = H + 'px'; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const fa = Math.max(2, Math.round(pitch * dpr * 0.6)), fb = fa * 3;
  gA.width = Math.ceil(cv.width / fa); gA.height = Math.ceil(cv.height / fa); gB.width = Math.ceil(cv.width / fb); gB.height = Math.ceil(cv.height / fb);
  geo = { dpr, W, H, pad, perRow, pitch, rows, band, rowH, offX, fa, fb };
}
const ledX = i => geo.offX + ((i % geo.perRow) + 0.5) * geo.pitch;
const ledY = i => geo.pad + Math.floor(i / geo.perRow) * geo.rowH + geo.band + geo.pitch / 2;

const N = () => strip.count;
let frame = new Float32Array(0), lin = new Float32Array(0), css = [];
function compose() {
  const n = N(); if (frame.length !== n * 4) { frame = new Float32Array(n * 4); lin = new Float32Array(n * 3); css = new Array(n); }
  frame.fill(0);
  for (const s of segs) {
    if (!s.on || s.stop <= s.start) continue; const r = rtFor(s), k = s.bri / 255;
    for (let i = 0; i < r.L; i++) { const idx = s.start + (s.rev ? r.L - 1 - i : i); if (idx >= n) continue; const o = i * 4, q = idx * 4;
      frame[q] = r.px[o] * k; frame[q + 1] = r.px[o + 1] * k; frame[q + 2] = r.px[o + 2] * k; frame[q + 3] = strip.rgbw ? r.px[o + 3] * k : 0; }
  }
  const b = strip.bri / 255, gm = v => strip.gamma ? GL[v >= 255 ? 255 : v <= 0 ? 0 : Math.round(v)] : v;
  for (let i = 0; i < n; i++) { const q = i * 4, o = i * 3, w = gm(frame[q + 3]) * b / 255;
    lin[o] = gm(frame[q]) * b / 255 + w; lin[o + 1] = gm(frame[q + 1]) * b / 255 + w * 0.93; lin[o + 2] = gm(frame[q + 2]) * b / 255 + w * 0.82; }
}
function draw() {
  const g = geo, n = N(), d = g.dpr, e = 1 / 2.2;
  for (let i = 0; i < n; i++) { const o = i * 3, r = lin[o], gg = lin[o + 1], bb = lin[o + 2], m = Math.max(r, gg, bb);
    if (m < 0.0015) { css[i] = null; continue; } const hot = Math.min(0.45, Math.max(0, m - 0.6));
    const R = Math.pow(Math.min(1, r), e), G = Math.pow(Math.min(1, gg), e), B = Math.pow(Math.min(1, bb), e);
    css[i] = `rgb(${Math.round((R + (1 - R) * hot) * 255)},${Math.round((G + (1 - G) * hot) * 255)},${Math.round((B + (1 - B) * hot) * 255)})`; }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#05070b'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(d, 0, 0, d, 0, 0);
  // segment bands
  ctx.font = '600 10.5px "JetBrains Mono", ui-monospace, monospace'; ctx.textBaseline = 'middle';
  segs.forEach((s, si) => {
    if (s.stop <= s.start) return; const col = SEGC[si % SEGC.length], a = Math.max(0, s.start), b = Math.min(n, s.stop); if (b <= a) return;
    ctx.globalAlpha = s.on ? 0.95 : 0.35; ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2;
    for (let r = Math.floor(a / g.perRow); r <= Math.floor((b - 1) / g.perRow); r++) {

function glow(c, cc, f, strength) {

/* ================= loop ================= */
let last = performance.now();
function tick(now) {
  const dt = Math.min(100, now - last); last = now;
  for (const s of segs) { if (!s.on || s.stop <= s.start) continue; const r = rtFor(s); r.acc += dt; let n = 0;
    while (r.acc >= 24 && n < 5) { FX[s.fx].f(r, r.t); r.t += 24; r.acc -= 24; n++; } if (n >= 5) r.acc = 0; }
  compose(); draw(); requestAnimationFrame(tick);
}

/* ================= UI ================= */
const $ = id => document.getElementById(id);
const hex = c => '#' + [0, 1, 2].map(i => Math.max(0, Math.min(255, c[i] | 0)).toString(16).padStart(2, '0')).join('');
const unhex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function el(tag, attrs = {}, kids = []) { const e = document.createElement(tag); for (const k in attrs) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); } kids.forEach(x => x && e.appendChild(x)); return e; }

function fxOptions(sel, cur) {

  for (const k in FX) { const f = FX[k]; const o = el('option', { value: String(k), text: f.info.name + (f.approx ? ' (≈)' : '') + (f.own ? '' : ' · ' + k) }); if (String(k) === String(cur)) o.selected = true; (f.own ? gOwn : gIn).appendChild(o); }
  sel.appendChild(gOwn); sel.appendChild(gIn);
}

function sliderRow(label, val, max, onInput, id) {
  const inp = el('input', { type: 'range', min: '0', max: String(max), id }); inp.value = val;
  const out = el('output', { for: id, text: String(val) });
  inp.addEventListener('input', () => { out.textContent = inp.value; onInput(+inp.value); });
  return el('div', { class: 'slider' }, [el('span', { class: 'lbl', text: label }), inp, out]);
}

function segCard(s, si) {

  card.style.setProperty('--segc', SEGC[si % SEGC.length]);
  const sel = el('select', { id: 'fx-' + si, 'aria-label': t('effect') }); fxOptions(sel, s.fx);
  sel.addEventListener('change', () => { s.fx = fxKey(sel.value); applyDefaults(s); restart(s); renderAll(); });

  const rep = el('button', { class: 'btn small', type: 'button', text: t('replay') }); rep.addEventListener('click', () => restart(s));

    inp.addEventListener('change', () => { let v = Math.round(+inp.value); if (!isFinite(v)) v = s[key]; v = Math.max(0, Math.min(strip.count, v));
      if (key === 'start' && v >= s.stop) v = s.stop - 1; if (key === 'stop' && v <= s.start) v = s.start + 1; s[key] = v; renderAll(); });
    return el('div', { class: 'field' }, [el('span', { class: 'lbl', text: t(key) }), inp]); };

      w.addEventListener('change', () => { s.col[ci][3] = Math.max(0, Math.min(255, Math.round(+w.value) || 0)); updateOut(); }); kids.push(el('span', { class: 'lbl', text: t('white') }), w); }

function renderSegs() {

  if (!segs.length) host.appendChild(el('p', { class: 'empty', text: t('noSegs') }));
  segs.forEach((s, i) => host.appendChild(segCard(s, i)));
}
function drawMeta() { $('meta').innerHTML = ''; $('meta').appendChild(el('span', { text: t('meta', { c: strip.count, s: segs.length, r: geo ? geo.rows : 1 }) })); }

function segJson(s) {
  const o = { id: s.id, start: s.start, stop: s.stop, on: s.on, bri: s.bri, fx: FX[s.fx].own ? FX[s.fx].info.name : s.fx, sx: s.sx, ix: s.ix };
  const ctl = FX[s.fx].info.ctl.map(c => c.k);
  for (const k of ['c1', 'c2', 'c3']) if (ctl.includes(k)) o[k] = s[k];
  for (const k of ['o1', 'o2', 'o3']) if (ctl.includes(k)) o[k] = !!s[k];
  o.pal = s.pal; o.col = s.col.map(c => strip.rgbw ? [c[0], c[1], c[2], c[3] | 0] : [c[0], c[1], c[2]]); o.rev = s.rev;

  const lines = ['{', `  "on": true,`, `  "bri": ${strip.bri},`, '  "seg": ['];
  segs.forEach((s, i) => lines.push('    ' + JSON.stringify(segJson(s)) + (i < segs.length - 1 ? ',' : '')));
  lines.push('  ]', '}'); $('out').textContent = lines.join('\n'); $('copyMsg').hidden = true;
}

  $('count').value = strip.count; $('rgbw').value = strip.rgbw ? '1' : '0'; $('perRow').value = strip.perRow; $('bri').value = strip.bri; $('briOut').textContent = strip.bri; $('gamma').checked = strip.gamma;
}

  const ex = $('examples'); ex.innerHTML = ''; ex.appendChild(el('option', { value: '', text: t('ex').pick }));
  for (const k in EX) ex.appendChild(el('option', { value: k, text: t('ex')[k] }));

/* ---- import ---- */
function parseCol(c) {
  if (Array.isArray(c)) return [c[0] | 0, c[1] | 0, c[2] | 0, c[3] | 0];
  if (typeof c === 'string') { const h = c.replace('#', ''); if (h.length === 8) return [parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), parseInt(h.slice(6, 8), 16), parseInt(h.slice(0, 2), 16)];
    if (h.length === 6) return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), 0]; }
  return [0, 0, 0, 0];
}
function doImport() {
  const msg = $('inMsg'); msg.hidden = false; msg.className = 'msg';
  let o; try { o = JSON.parse($('in').value); } catch (e) { msg.textContent = t('importErr', { m: e.message }); msg.className = 'msg err'; return; }
  const st = o.state || o, info = o.info || {};
  const raw = (Array.isArray(st.seg) ? st.seg : st.seg ? [st.seg] : []).filter(x => (x.stop ?? 0) > (x.start ?? 0));
  if (!raw.length) { msg.textContent = t('noSegIn'); msg.className = 'msg err'; return; }
  const unknown = [];
  if (typeof st.bri === 'number') strip.bri = st.bri;
  strip.count = (info.leds && info.leds.count) || Math.max(...raw.map(x => x.stop));
  if (info.leds && typeof info.leds.rgbw === 'boolean') strip.rgbw = info.leds.rgbw; else strip.rgbw = raw.some(x => (x.col || []).some(c => Array.isArray(c) && c.length > 3 && c[3] > 0));
  segs = raw.map(x => {
    let fx = x.fx ?? 0;
    if (typeof fx === 'string') { const hit = Object.keys(FX).find(k => FX[k].info.name.toLowerCase() === fx.toLowerCase()); fx = hit !== undefined ? fxKey(hit) : (unknown.push(fx), 0); }
    else if (!FX[fx]) { unknown.push(fx); fx = 0; }
    const s = newSeg(x.start | 0, x.stop | 0, fx);
    for (const k of ['sx', 'ix', 'c1', 'c2', 'c3', 'bri', 'pal']) if (typeof x[k] === 'number') s[k] = x[k];
    for (const k of ['o1', 'o2', 'o3', 'on', 'rev']) if (typeof x[k] === 'boolean') s[k] = x[k];
    if (Array.isArray(x.col)) s.col = [0, 1, 2].map(i => x.col[i] !== undefined ? parseCol(x.col[i]) : [0, 0, 0, 0]);
    if (s.pal && ![0, 5, 6, 11, 35].includes(s.pal)) s.pal = 0;
    return s;
  });
  renumber(); renderAll();
  msg.textContent = t('importOk', { n: segs.length }) + (unknown.length ? ' ' + t('unknownFx', { l: [...new Set(unknown)].join(', ') }) : '');
}

/* ---- wiring ---- */
$('count').addEventListener('change', () => { strip.count = Math.max(1, Math.min(1500, Math.round(+$('count').value) || 1));
  segs.forEach(s => { s.stop = Math.min(s.stop, strip.count); s.start = Math.min(s.start, s.stop - 1); }); segs = segs.filter(s => s.stop > s.start); renumber(); renderAll(); });
$('rgbw').addEventListener('change', () => { strip.rgbw = $('rgbw').value === '1'; renderAll(); });
$('perRow').addEventListener('change', () => { strip.perRow = Math.max(0, Math.round(+$('perRow').value) || 0); layout(); drawMeta(); });
$('bri').addEventListener('input', () => { strip.bri = +$('bri').value; $('briOut').textContent = strip.bri; updateOut(); });
$('gamma').addEventListener('change', () => { strip.gamma = $('gamma').checked; });
$('examples').addEventListener('change', () => { if ($('examples').value) loadExample($('examples').value); $('examples').value = ''; });
$('splitBtn').addEventListener('click', () => {
  const n = Math.max(1, Math.min(32, Math.round(+$('splitN').value) || 1)), keep = segs.slice(); segs = [];
  for (let i = 0; i < n; i++) { const a = Math.floor(i * strip.count / n), b = Math.floor((i + 1) * strip.count / n); if (b <= a) continue;
    const src = keep[i]; segs.push(src ? Object.assign(newSeg(a, b, src.fx), { sx: src.sx, ix: src.ix, c1: src.c1, c2: src.c2, c3: src.c3, o1: src.o1, o2: src.o2, o3: src.o3, pal: src.pal, col: src.col.map(c => c.slice()), bri: src.bri, rev: src.rev }) : newSeg(a, b, 85, { col: [[255, 170, 0, 0]] })); }
  renumber(); renderAll(); });
$('addSeg').addEventListener('click', () => {
  const end = segs.reduce((m, s) => Math.max(m, s.stop), 0), a = end < strip.count ? end : Math.max(0, strip.count - Math.max(1, Math.floor(strip.count / 4)));
  segs.push(newSeg(a, strip.count, 85)); renumber(); renderAll(); });
$('restart').addEventListener('click', () => segs.forEach(restart));
$('apply').addEventListener('click', doImport);
$('copy').addEventListener('click', () => {
  const pre = $('out'), msg = $('copyMsg');
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); msg.textContent = t('selected'); msg.hidden = false; };
  try { navigator.clipboard.writeText(pre.textContent).then(() => { msg.textContent = t('copied'); msg.hidden = false; }, fallback); } catch (e) { fallback(); }
});
$('lang').addEventListener('click', () => { lang = lang === 'de' ? 'en' : 'de'; try { localStorage.setItem('whfx-lang', lang); } catch (e) { /* no storage */ } applyTexts(); renderAll(); });
let lastW = 0;
new ResizeObserver(() => { const w = box.clientWidth; if (w === lastW) return; lastW = w; layout(); drawMeta(); }).observe(box);

applyTexts(); loadExample('five');
requestAnimationFrame(x => { last = x; requestAnimationFrame(tick); });
})();
</script>
